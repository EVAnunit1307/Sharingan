[/Script/EngineSettings.GeneralProjectSettings]
bStartInVR=True
[/Script/UnrealEd.ProjectPackagingSettings]
+DirectoriesToAlwaysStageAsNonUFS=(Path=".")
; This project has no Content-folder assets of its own (all C++, no
; Blueprints), so nothing in the normal cook reference graph points at
; /Engine/EngineFonts/ -- on-device testing (4 Sept) suggests the Android
; cook may be dropping those font textures as unreferenced, leaving HUD
; text invisible even though the UFont objects themselves still load.
; Force the whole directory into every cook regardless of what references it.
+DirectoriesToAlwaysCook=(Path="/Engine/EngineFonts")
